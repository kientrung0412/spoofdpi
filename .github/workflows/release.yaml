name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target Tag Name (e.g., v2.0.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  WINDIVERT_VERSION: '2.2.2'
  WINTUN_VERSION: '0.14.1'

jobs:
  release-please:
    if: github.event_name == 'push' && !github.event.repository.fork
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name:        ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: .github/release-please-config.json
          manifest-file: .manifest.json

  build:
    needs: release-please
    if: |
      !github.event.repository.fork && !cancelled() && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        env:
          SPOOFDPI_BUILD: release
        run: |
          export SPOOFDPI_COMMIT=$(git rev-parse --short HEAD)
          cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows, with WinDivert and Wintun)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "spoofdpi-${{ matrix.name }}"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/spoofdpi.exe" $dist

          Invoke-WebRequest "https://github.com/basil00/WinDivert/releases/download/v$env:WINDIVERT_VERSION/WinDivert-$env:WINDIVERT_VERSION-A.zip" -OutFile windivert.zip
          Expand-Archive windivert.zip -DestinationPath windivert
          $wd = Get-ChildItem windivert | Select-Object -First 1
          Copy-Item "$($wd.FullName)/x64/WinDivert.dll", "$($wd.FullName)/x64/WinDivert64.sys" $dist
          Copy-Item "$($wd.FullName)/LICENSE" "$dist/LICENSE-WinDivert.txt"

          Invoke-WebRequest "https://www.wintun.net/builds/wintun-$env:WINTUN_VERSION.zip" -OutFile wintun.zip
          Expand-Archive wintun.zip -DestinationPath wintun
          Copy-Item "wintun/wintun/bin/amd64/wintun.dll" $dist
          Copy-Item "wintun/wintun/LICENSE.txt" "$dist/LICENSE-Wintun.txt"

          Copy-Item LICENSE "$dist/LICENSE.txt"
          Compress-Archive -Path "$dist/*" -DestinationPath "$dist.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dist="spoofdpi-${{ matrix.name }}"
          mkdir -p "$dist"
          cp "target/${{ matrix.target }}/release/spoofdpi" LICENSE "$dist/"
          tar -czf "$dist.tar.gz" "$dist"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" spoofdpi-${{ matrix.name }}.* --clobber
